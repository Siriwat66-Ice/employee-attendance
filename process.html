<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>จัดการ Process</title>

  <style>

    /* =========================
       ตั้งค่าพื้นฐาน
    ========================= */

    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #10233f;
      --blue: #2864e8;
      --green: #15a66a;
      --orange: #e89425;
      --red: #df405a;
      --purple: #7858d6;
      --text: #182740;
      --gray: #718095;
      --border: #e3e9f2;
      --background: #f3f7fc;
      --white: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(61, 113, 234, 0.09),
          transparent 30%
        ),
        var(--background);

      color: var(--text);

      font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Tahoma,
        Arial,
        sans-serif;
    }

    a {
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }


    /* =========================
       เมนูด้านซ้าย
    ========================= */

    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;

      width: 88px;
      padding: 22px 10px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;

      background:
        linear-gradient(
          180deg,
          #142d50,
          #0c1c33
        );

      box-shadow:
        8px 0 30px rgba(10, 30, 60, 0.13);

      z-index: 100;
    }

    .logo {
      width: 46px;
      height: 46px;
      margin-bottom: 28px;

      display: grid;
      place-items: center;

      border-radius: 14px;
      background: white;
      color: var(--blue);

      font-size: 25px;
      font-weight: 900;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .sidebar a {
      width: 100%;
      min-height: 62px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;

      border-radius: 13px;

      color: #8fa1b9;
      font-size: 21px;

      transition: 0.25s;
    }

    .sidebar a small {
      font-size: 10px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar a.active {
      border-left: 3px solid #5c91ff;
    }


    /* =========================
       เนื้อหาหลัก
    ========================= */

    .content {
      width: calc(100% - 88px);
      max-width: 1500px;

      margin-left: 88px;
      padding: 30px 35px 60px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 25px;
    }

    .kicker {
      color: var(--blue);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 7px 0 5px;

      color: #14233c;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;

      color: var(--gray);
      font-size: 12px;
    }

    .add-button {
      padding: 11px 17px;

      border: none;
      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #245bdc,
          #3475ef
        );

      color: white;

      font-size: 11px;
      font-weight: 700;
      cursor: pointer;

      box-shadow:
        0 9px 22px rgba(40, 100, 232, 0.22);

      transition: 0.2s;
    }

    .add-button:hover {
      transform: translateY(-2px);
    }


    /* =========================
       กล่องสรุป
    ========================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;

      margin-bottom: 22px;
    }

    .summary-card {
      min-height: 115px;
      padding: 21px;

      border: 1px solid var(--border);
      border-radius: 17px;

      background: white;

      box-shadow:
        0 10px 28px rgba(24, 50, 90, 0.06);
    }

    .summary-card span {
      display: block;

      color: var(--gray);
      font-size: 11px;
    }

    .summary-card strong {
      display: block;

      margin: 7px 0 3px;

      color: #172641;
      font-size: 29px;
    }

    .summary-card small {
      color: #8996a8;
      font-size: 10px;
    }

    .summary-card.blue {
      border: none;

      background:
        linear-gradient(
          135deg,
          #2258d7,
          #3978f5
        );

      color: white;
    }

    .summary-card.blue span,
    .summary-card.blue small {
      color: #dce8ff;
    }

    .summary-card.blue strong {
      color: white;
    }


    /* =========================
       แบบฟอร์ม
    ========================= */

    .form-card {
      display: none;

      margin-bottom: 22px;
      padding: 23px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: white;

      box-shadow:
        0 12px 35px rgba(24, 50, 90, 0.07);
    }

    .form-card.show {
      display: block;
    }

    .form-card h2 {
      margin: 0 0 18px;

      font-size: 17px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 13px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;

      color: #59687a;

      font-size: 10px;
      font-weight: 700;
    }

    input,
    select {
      height: 41px;
      padding: 0 11px;

      border: 1px solid #dfe5ed;
      border-radius: 9px;

      outline: none;
      background: white;
      color: #344258;
    }

    input:focus,
    select:focus {
      border-color: #5b85e8;

      box-shadow:
        0 0 0 4px rgba(40, 100, 232, 0.09);
    }

    .save-button {
      height: 41px;
      align-self: end;

      border: none;
      border-radius: 9px;

      background: var(--green);
      color: white;

      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =========================
       การ์ด Process
    ========================= */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 28px 0 14px;
    }

    .section-title h2 {
      margin: 0 0 5px;

      font-size: 18px;
    }

    .section-title p {
      margin: 0;

      color: var(--gray);
      font-size: 11px;
    }

    .search-input {
      width: 100%;
      max-width: 330px;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .process-card {
      position: relative;

      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 17px;

      background: white;

      box-shadow:
        0 10px 28px rgba(24, 50, 90, 0.06);

      transition: 0.25s;
    }

    .process-card:hover {
      transform: translateY(-4px);

      border-color: #c9d8f7;

      box-shadow:
        0 16px 35px rgba(24, 50, 90, 0.11);
    }

    .process-code {
      display: inline-grid;
      place-items: center;

      min-width: 44px;
      height: 35px;
      padding: 0 9px;

      border-radius: 9px;

      background: #edf3ff;
      color: var(--blue);

      font-size: 10px;
      font-weight: 800;
    }

    .active-status {
      float: right;

      padding: 6px 9px;

      border-radius: 20px;

      background: #e7f8f0;
      color: var(--green);

      font-size: 9px;
      font-weight: 700;
    }

    .process-card h3 {
      margin: 15px 0 5px;

      color: #26344a;
      font-size: 14px;
    }

    .station {
      color: var(--gray);
      font-size: 10px;
    }

    .people-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-top: 18px;
    }

    .people-row strong {
      color: #172641;
      font-size: 28px;
    }

    .people-row small {
      color: var(--gray);
      font-size: 10px;
    }

    .percent {
      color: var(--blue);

      font-size: 11px;
      font-weight: 700;
    }

    .progress {
      height: 6px;
      margin-top: 10px;

      overflow: hidden;

      border-radius: 20px;
      background: #edf1f6;
    }

    .progress i {
      display: block;
      height: 100%;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #2864e8,
          #5d8ef8
        );
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 17px;
      padding-top: 13px;

      border-top: 1px solid #edf1f5;
    }

    .standard-time {
      color: var(--gray);
      font-size: 9px;
    }

    .delete-button {
      padding: 6px 9px;

      border: none;
      border-radius: 7px;

      background: #feecef;
      color: #c53650;

      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty {
      grid-column: 1 / -1;

      padding: 40px;

      border: 1px dashed #cfd8e5;
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.6);
      color: var(--gray);

      text-align: center;
      font-size: 12px;
    }


    /* =========================
       Responsive
    ========================= */

    @media (max-width: 1100px) {
      .process-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 62px;
      }

      .sidebar a small {
        display: none;
      }

      .content {
        width: calc(100% - 62px);
        margin-left: 62px;
        padding: 20px 14px 40px;
      }

      .page-header,
      .section-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 14px;
      }

      .summary-grid,
      .process-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .search-input {
        max-width: none;
      }
    }

  </style>

</head>


<body>

  <!-- เมนูด้านซ้าย -->

  <aside class="sidebar">

    <div class="logo">F</div>

    <a href="index.html">
      ▦
      <small>ภาพรวม</small>
    </a>

    <a href="employees.html">
      ♙
      <small>พนักงาน</small>
    </a>

    <a class="active" href="process.html">
      ⌘
      <small>Process</small>
    </a>

  </aside>


  <!-- เนื้อหาหลัก -->

  <main class="content">

    <header class="page-header">

      <div>

        <span class="kicker">
          PROCESS MANAGEMENT
        </span>

        <h1>จัดการ Process</h1>

        <p>
          เพิ่มจุดปฏิบัติงานและตรวจสอบกำลังคนในแต่ละ Process
        </p>

      </div>

      <button
        class="add-button"
        id="openFormButton"
      >
        + เพิ่ม Process
      </button>

    </header>


    <!-- กล่องสรุป -->

    <section class="summary-grid">

      <article class="summary-card blue">

        <span>Process ทั้งหมด</span>

        <strong id="totalProcess">
          0
        </strong>

        <small>จุดปฏิบัติงาน</small>

      </article>

      <article class="summary-card">

        <span>พนักงานกำลังทำงาน</span>

        <strong id="totalWorking">
          0
        </strong>

        <small>คนในทุก Process</small>

      </article>

      <article class="summary-card">

        <span>กำลังคนรวมสูงสุด</span>

        <strong id="totalCapacity">
          0
        </strong>

        <small>คน</small>

      </article>

    </section>


    <!-- แบบฟอร์มเพิ่ม Process -->

    <section
      class="form-card"
      id="processFormCard"
    >

      <h2>เพิ่ม Process ใหม่</h2>

      <form
        class="form-grid"
        id="processForm"
      >

        <label>
          รหัส Process

          <input
            id="processCode"
            required
            placeholder="ASM"
          >
        </label>

        <label>
          ชื่อ Process

          <input
            id="processName"
            required
            placeholder="ประกอบ"
          >
        </label>

        <label>
          รหัสจุดปฏิบัติงาน

          <input
            id="stationCode"
            required
            placeholder="ASM-01"
          >
        </label>

        <label>
          จำนวนคนสูงสุด

          <input
            id="capacity"
            type="number"
            min="1"
            value="10"
            required
          >
        </label>

        <label>
          เวลามาตรฐาน (นาที)

          <input
            id="standardTime"
            type="number"
            min="1"
            value="480"
            required
          >
        </label>

        <button
          class="save-button"
          type="submit"
        >
          บันทึก Process
        </button>

      </form>

    </section>


    <!-- รายการ Process -->

    <section>

      <div class="section-title">

        <div>

          <h2>รายการ Process</h2>

          <p>
            ข้อมูลจุดปฏิบัติงานทั้งหมดในระบบ
          </p>

        </div>

        <input
          class="search-input"
          id="searchInput"
          placeholder="ค้นหาชื่อหรือรหัส Process..."
        >

      </div>

      <div
        class="process-grid"
        id="processGrid"
      ></div>

    </section>

  </main>


  <script>

    /* =========================
       ข้อมูลเริ่มต้น
    ========================= */

    const defaultProcesses = [
      {
        code: "CUT",
        name: "ตัดชิ้นงาน",
        station: "CUT-01",
        capacity: 16,
        standardTime: 480
      },
      {
        code: "ASM",
        name: "ประกอบ",
        station: "ASM-01",
        capacity: 22,
        standardTime: 480
      },
      {
        code: "QC",
        name: "ตรวจสอบคุณภาพ",
        station: "QC-01",
        capacity: 10,
        standardTime: 480
      },
      {
        code: "PKG",
        name: "บรรจุสินค้า",
        station: "PKG-01",
        capacity: 12,
        standardTime: 480
      }
    ];


    let processes = JSON.parse(
      localStorage.getItem("processes")
    );


    if (!processes) {

      processes = defaultProcesses;

      localStorage.setItem(
        "processes",
        JSON.stringify(processes)
      );
    }


    let employees = JSON.parse(
      localStorage.getItem("employees")
    ) || [];


    /* =========================
       เปิดและปิดแบบฟอร์ม
    ========================= */

    const formCard =
      document.getElementById(
        "processFormCard"
      );


    document
      .getElementById("openFormButton")
      .addEventListener(
        "click",
        function () {

          formCard.classList.toggle("show");

        }
      );


    /* =========================
       คำนวณจำนวนพนักงาน
    ========================= */

    function countWorking(process) {

      return employees.filter(
        function (employee) {

          const employeeProcess =
            String(
              employee.process || ""
            ).toLowerCase();


          return (
            employeeProcess ===
              process.name.toLowerCase() ||

            employeeProcess ===
              process.code.toLowerCase()
          );

        }
      ).length;
    }


    /* =========================
       แสดงรายการ Process
    ========================= */

    function renderProcesses() {

      const searchText =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase();


      const filteredProcesses =
        processes.filter(
          function (process) {

            return (
              process.name
                .toLowerCase()
                .includes(searchText) ||

              process.code
                .toLowerCase()
                .includes(searchText) ||

              process.station
                .toLowerCase()
                .includes(searchText)
            );

          }
        );


      const grid =
        document.getElementById(
          "processGrid"
        );


      if (filteredProcesses.length === 0) {

        grid.innerHTML = `
          <div class="empty">
            ไม่พบข้อมูล Process
          </div>
        `;

      } else {

        grid.innerHTML =
          filteredProcesses.map(
            function (process) {

              const realIndex =
                processes.findIndex(
                  function (item) {
                    return item.code === process.code;
                  }
                );


              const active =
                countWorking(process);


              const percent =
                Math.min(
                  100,
                  Math.round(
                    active /
                    process.capacity *
                    100
                  )
                );


              return `
                <article class="process-card">

                  <span class="process-code">
                    ${process.code}
                  </span>

                  <span class="active-status">
                    ● เปิดใช้งาน
                  </span>

                  <h3>
                    ${process.name}
                  </h3>

                  <span class="station">
                    จุดปฏิบัติงาน:
                    ${process.station}
                  </span>

                  <div class="people-row">

                    <div>
                      <strong>
                        ${active}
                      </strong>

                      <small>
                        / ${process.capacity} คน
                      </small>
                    </div>

                    <span class="percent">
                      ${percent}%
                    </span>

                  </div>

                  <div class="progress">

                    <i
                      style="width: ${percent}%"
                    ></i>

                  </div>

                  <div class="card-footer">

                    <span class="standard-time">
                      เวลามาตรฐาน
                      ${process.standardTime} นาที
                    </span>

                    <button
                      class="delete-button"
                      onclick="deleteProcess(${realIndex})"
                    >
                      ลบ
                    </button>

                  </div>

                </article>
              `;

            }
          ).join("");

      }


      updateSummary();
    }


    /* =========================
       ตัวเลขสรุป
    ========================= */

    function updateSummary() {

      const totalCapacity =
        processes.reduce(
          function (total, process) {
            return total + Number(process.capacity);
          },
          0
        );


      const totalWorking =
        employees.filter(
          function (employee) {

            return (
              employee.status ===
                "กำลังทำงาน" ||

              employee.status ===
                "working"
            );

          }
        ).length;


      document.getElementById(
        "totalProcess"
      ).textContent = processes.length;


      document.getElementById(
        "totalWorking"
      ).textContent = totalWorking;


      document.getElementById(
        "totalCapacity"
      ).textContent = totalCapacity;
    }


    /* =========================
       เพิ่ม Process
    ========================= */

    document
      .getElementById("processForm")
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();


          const processCode =
            document
              .getElementById("processCode")
              .value
              .trim()
              .toUpperCase();


          const duplicate =
            processes.some(
              function (process) {

                return (
                  process.code ===
                  processCode
                );

              }
            );


          if (duplicate) {

            alert(
              "รหัส Process นี้มีอยู่แล้ว"
            );

            return;
          }


          const newProcess = {

            code: processCode,

            name:
              document
                .getElementById("processName")
                .value
                .trim(),

            station:
              document
                .getElementById("stationCode")
                .value
                .trim()
                .toUpperCase(),

            capacity:
              Number(
                document
                  .getElementById("capacity")
                  .value
              ),

            standardTime:
              Number(
                document
                  .getElementById("standardTime")
                  .value
              )
          };


          processes.push(newProcess);


          localStorage.setItem(
            "processes",
            JSON.stringify(processes)
          );


          event.target.reset();

          formCard.classList.remove("show");

          renderProcesses();
        }
      );


    /* =========================
       ลบ Process
    ========================= */

    function deleteProcess(index) {

      const confirmed =
        confirm(
          "ต้องการลบ Process นี้หรือไม่?"
        );


      if (!confirmed) {
        return;
      }


      processes.splice(index, 1);


      localStorage.setItem(
        "processes",
        JSON.stringify(processes)
      );


      renderProcesses();
    }


    /* =========================
       ระบบค้นหา
    ========================= */

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        renderProcesses
      );


    /* เริ่มต้นแสดงข้อมูล */

    renderProcesses();

  </script>

</body>

</html>
